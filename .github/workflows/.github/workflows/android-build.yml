
name: Yasmin AI APK Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Yasmin AI APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Check project location
      - name: Verify Android Project
        run: |
          echo "Checking project files..."
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew
          echo "Project root verified!"

      # 3. Install Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Install Python 3.11
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. Install SDK packages
      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 7. Install Gradle 8.9
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 8. Generate missing wrapper JAR
      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle Wrapper..."
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew

      # 9. Check Java and Gradle
      - name: Verify Build Environment
        run: |
          java -version
          ./gradlew --version

      # 10. Build APK
      - name: Build Yasmin AI Debug APK
        run: |
          ./gradlew clean assembleDebug \
            --stacktrace \
            --no-daemon \
            --warning-mode all

      # 11. Verify APK
      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found!"
            find app/build/outputs -type f || true
            exit 1
          fi

          echo "APK successfully generated!"
          ls -lh "$APK_PATH"

      # 12. Upload APK
      - name: Upload Yasmin AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Yasmin-AI-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 13. Build summary
      - name: Build Success
        if: success()
        run: |
          echo "Yasmin AI APK Build Successful!"
