
name: Yasmin AI APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Yasmin AI Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Python for Chaquopy
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install Android SDK packages
      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. Find or Extract Android Project
      - name: Find Yasmin AI Project
        shell: bash
        run: |
          set -e

          echo "Searching Android project..."

          PROJECT_DIR=""

          # First check repository root and folders
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE" \
            -type f -name "settings.gradle.kts" \
            -not -path "*/.gradle/*" \
            -printf '%h\n' | head -n 1)

          # If not found, extract ZIP archive
          if [ -z "$PROJECT_DIR" ]; then

            echo "Project not found. Searching ZIP files..."

            ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
              -type f -iname "*.zip" | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No Android project or ZIP file found!"
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/yasmin-project"

            unzip -oq "$ZIP_FILE" \
              -d "$RUNNER_TEMP/yasmin-project"

            PROJECT_DIR=$(find "$RUNNER_TEMP/yasmin-project" \
              -type f -name "settings.gradle.kts" \
              -not -path "*/.gradle/*" \
              -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project folder not found!"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts missing!"
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" \
            >> "$GITHUB_ENV"

      # 7. Setup Gradle 8.9
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 8. Verify Project
      - name: Verify Project Files
        run: |
          cd "$ANDROID_PROJECT_DIR"

          echo "Checking Yasmin AI project..."

          ls -la

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/wrapper/gradle-wrapper.properties

          echo "Project verification successful!"

      # 9. Build Debug APK
      - name: Build Yasmin AI APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT_DIR"

          echo "Starting Yasmin AI build..."

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon \
            --warning-mode all

      # 10. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK file was not generated!"
            exit 1
          fi

          echo "APK successfully generated!"
          ls -lh "$APK"

      # 11. Upload APK
      - name: Upload Yasmin AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Yasmin-AI-APK
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 12. Build Summary
      - name: Build Summary
        if: success()
        run: |
          echo "================================"
          echo "YASMIN AI BUILD SUCCESSFUL!"
          echo "APK IS READY!"
          echo "================================"
